<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lab 3 - Smart Parking</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        #dashboard {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        #estacionamiento {
            position: relative;
            width: 800px;
            height: 600px;
            margin: 0 auto;
            background-color: #bdc3c7; /* Color de fondo gris por si no tienes la imagen aún */
            /* background-image: url('tu-imagen.jpg'); Quita los diagonales asterisco cuando tengas tu imagen */
            border: 3px solid #333;
            border-radius: 8px;
        }
        .cajon {
            position: absolute;
            width: 40px;
            height: 70px;
            border: 2px solid white;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .disponible { background-color: rgba(46, 204, 113, 0.8); }
        .ocupado { background-color: rgba(231, 76, 60, 0.8); }
        .en-mantenimiento { background-color: rgba(241, 196, 15, 0.8); }
    </style>
</head>
<body>

    <h1>Smart Parking - Tec de Monterrey</h1>

    <!-- DASHBOARD: Aquí están TODOS los IDs que tu JavaScript necesita -->
    <section id="dashboard">
        <p>Total: <span id="total">0</span></p>
        <p>Ocupados: <span id="ocupados">0</span></p>
        <p>Disponibles: <span id="disponibles">0</span></p>
        <p>Mantenimiento: <span id="en-mantenimiento">0</span></p>
        <p>Ocupación: <span id="porcentaje">0</span>%</p>
    </section>

    <!-- ESTACIONAMIENTO -->
    <section id="estacionamiento">
        <!-- Puse 5 cajones de ejemplo con posiciones inventadas para que los veas -->
        <div class="cajon" style="top: 50px; left: 100px;"></div>
        <div class="cajon" style="top: 50px; left: 160px;"></div>
        <div class="cajon" style="top: 50px; left: 220px;"></div>
        <div class="cajon" style="top: 150px; left: 100px;"></div>
        <div class="cajon" style="top: 150px; left: 160px;"></div>
    </section>

    <script>
        const cajones = document.querySelectorAll('.cajon');
        const txtTotal = document.getElementById('total');
        const txtEnMantenimiento = document.getElementById('en-mantenimiento'); 
        const txtOcupados = document.getElementById('ocupados');
        const txtDisponibles = document.getElementById('disponibles');
        const txtPorcentaje = document.getElementById('porcentaje');

        // Asignar estado inicial
        cajones.forEach(cajon => {
            let probabilidad = Math.random(); 
            if (probabilidad < 0.3) {
                cajon.classList.add('en-mantenimiento');
            } else if (probabilidad < 0.6) { 
                cajon.classList.add('ocupado');
            } else {
                cajon.classList.add('disponible');
            }
        });

        function actualizarDashboard() {
            let total = cajones.length;
            let enMantenimiento = 0;
            let ocupados = 0;
            let disponibles = 0;

            cajones.forEach(cajon => {
                if (cajon.classList.contains('en-mantenimiento')) {
                    enMantenimiento++;
                } else if (cajon.classList.contains('ocupado')) {
                    ocupados++;
                } else {
                    disponibles++;
                }
            });

            let porcentaje = Math.round((ocupados / total) * 100);

            txtTotal.innerHTML = total;
            txtEnMantenimiento.innerHTML = enMantenimiento;
            txtOcupados.innerHTML = ocupados;
            txtDisponibles.innerHTML = disponibles;
            txtPorcentaje.innerHTML = porcentaje;
        }

        // Clics del usuario
        cajones.forEach(cajon => {
            cajon.onclick = function() {
                cajon.classList.remove('en-mantenimiento', 'ocupado', 'disponible');
                let probabilidad = Math.random(); 
                if (probabilidad < 0.3) {
                    cajon.classList.add('en-mantenimiento');
                } else if (probabilidad < 0.6) {
                    cajon.classList.add('ocupado');
                } else {
                    cajon.classList.add('disponible');
                }
                actualizarDashboard();
            };
        });

        // Simulación automática
        setInterval(function() {
            let numeroAlAzar = Math.floor(Math.random() * cajones.length);
            let cajonAleatorio = cajones[numeroAlAzar];

            cajonAleatorio.classList.remove('en-mantenimiento', 'ocupado', 'disponible');
            
            let probabilidad = Math.random(); 
            if (probabilidad < 0.3) {
                cajonAleatorio.classList.add('en-mantenimiento');
            } else if (probabilidad < 0.6) {
                cajonAleatorio.classList.add('ocupado');
            } else {
                cajonAleatorio.classList.add('disponible');
            }
            actualizarDashboard();
        }, 4000); 

        // Arrancar
        actualizarDashboard();
    </script>
</body>
</html>
